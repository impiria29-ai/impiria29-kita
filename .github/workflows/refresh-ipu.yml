name: Refresh Johan Setia IPU
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch latest official DOE reading
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const response = await fetch('https://hazemonitor.com/api/air-quality', {
            headers: { Accept: 'application/json' },
            signal: AbortSignal.timeout(20000)
          });
          if (!response.ok) throw new Error(`Haze Monitor returned HTTP ${response.status}`);
          const payload = await response.json();
          const stations = Array.isArray(payload.stations) ? payload.stations : [];
          const station = stations.find(item =>
            String(item.id || '').toUpperCase() === 'MCAQM001' ||
            /JOHAN\\s+SETIA/i.test(`${item.name || ''} ${item.fullName || ''}`)
          );
          const api = Number(station?.api);
          if (!station || !Number.isFinite(api) || api < 0 || !station.observedAt) {
            throw new Error('No valid current IPU reading for Johan Setia MCAQM001.');
          }
          const snapshot = {
            id: 'MCAQM001',
            name: 'Johan Setia',
            api,
            observedAt: station.observedAt,
            source: 'Department of Environment Malaysia via Haze Monitor',
            sourceUrl: 'https://hazemonitor.com/station/johan-setia'
          };
          fs.writeFileSync('site/ipu.json', JSON.stringify(snapshot, null, 2) + '\\n');
          NODE
      - name: Commit changed reading
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/ipu.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh Johan Setia IPU reading"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"ipu-updated"}'
